name: Playwright Concurrency Diagnostic

run-name: Playwright concurrency diagnostic

on:
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'Playwright test file, directory, or grep expression'
        required: false
        default: ''
        type: string
      trace_mode:
        description: 'Playwright trace mode'
        required: true
        default: 'retain-on-failure'
        type: choice
        options:
          - retain-on-failure
          - on-first-retry
          - 'off'

permissions:
  contents: read

jobs:
  concurrency-matrix:
    name: Playwright – workers ${{ matrix.workers }} – repeat ${{ matrix.repeat }}
    timeout-minutes: 45
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 4]
        repeat: [1, 2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          TRACE_MODE: ${{ inputs.trace_mode }}
        run: |
          set -o pipefail

          TEST_TARGET="${{ inputs.test_pattern }}"
          WORKERS="${{ matrix.workers }}"
          REPEAT="${{ matrix.repeat }}"

          echo "Running diagnostic with workers=${WORKERS}, repeat=${REPEAT}"
          echo "Trace mode: ${TRACE_MODE}"

          if [ -n "$TEST_TARGET" ]; then
            npx playwright test "$TEST_TARGET" \
              --workers="$WORKERS" \
              --retries=0 \
              --trace "$TRACE_MODE" \
              --reporter=list,json
          else
            npx playwright test \
              --workers="$WORKERS" \
              --retries=0 \
              --trace "$TRACE_MODE" \
              --reporter=list,json
          fi

      - name: Upload Playwright report and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostic-w${{ matrix.workers }}-r${{ matrix.repeat }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
