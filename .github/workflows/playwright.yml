name: Playwright Tests

on:
  # Triggers when test code is updated
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'          
      - '.gitignore'
      - 'LICENSE'        
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'          
      - '.gitignore'
      - 'LICENSE'  

  # Nightly automated regression testing
  # Runs Monday-Friday at 6:00 AM UTC
  schedule:
    - cron: '0 6 * * 1-5' 

  # Enables manual execution from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      trace_mode:
        description: 'Playwright Trace Mode'
        required: true
        default: 'on-first-retry'
        type: choice
        options:
          - on-first-retry
          - retain-on-failure
          - 'off'

  # Allows external deployment pipelines to trigger the tests
  repository_dispatch:
    types: [ app_deployed ]

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Running smoke tests only..."
            npx playwright test --grep "@smoke" --trace ${{ inputs.trace_mode || 'on-first-retry' }}
          else
            echo "Running full test suite..."
            npx playwright test --trace ${{ inputs.trace_mode || 'on-first-retry' }}
          fi

      - name: Upload HTML Report to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: always() # Ensures report uploads even if tests fail
        with:
          path: playwright-report/

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4