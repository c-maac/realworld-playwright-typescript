name: Playwright Tests

on:
  # Triggers when test code is updated
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

  # Nightly automated regression testing
  # Runs Monday-Friday at 6:00 AM UTC
  schedule:
    - cron: '0 6 * * 1-5'

  # Enables manual execution from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      trace_mode:
        description: 'Playwright Trace Mode'
        required: true
        default: 'on-first-retry'
        type: choice
        options:
          - on-first-retry
          - retain-on-failure
          - 'off'
      update_visual_baselines:
        description: 'Update visual regression baselines'
        required: false
        default: false
        type: boolean

  # Allows external deployment pipelines to trigger the tests
  repository_dispatch:
    types: [app_deployed]

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == true) }}
        env:
          TRACE_MODE: ${{ inputs.trace_mode || 'on-first-retry' }}
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Running smoke tests only..."
            npx playwright test --grep "@smoke" --trace "$TRACE_MODE"
          else
            echo "Running full test suite..."
            npx playwright test --trace "$TRACE_MODE"
          fi

      - name: Update Visual Baselines
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == true }}
        run: npx playwright test --project=visual-chrome --update-snapshots

      - name: Upload Updated Visual Baselines
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == true }}
        uses: actions/upload-artifact@v4
        with:
          name: updated-visual-baselines
          path: tests/visual/**/*.png
          if-no-files-found: error

      - name: Upload HTML Report to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: always() # Ensures report uploads even if tests fail
        with:
          path: playwright-report/

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
