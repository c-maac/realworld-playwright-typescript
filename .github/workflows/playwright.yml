name: Playwright Tests

on:
  # Triggers when test code is updated
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'          
      - '.gitignore'
      - 'LICENSE'        
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'          
      - '.gitignore'
      - 'LICENSE'  

  # Nightly automated regression testing
  # Runs Monday-Friday at 6:00 AM UTC
  schedule:
    - cron: '0 6 * * 1-5' 

  # Enables manual execution from the GitHub Actions UI
  workflow_dispatch:

  # Allows external deployment pipelines to trigger the tests
  repository_dispatch:
    types: [ app_deployed ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload HTML Test Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }} # Ensures report uploads even if tests fail
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30